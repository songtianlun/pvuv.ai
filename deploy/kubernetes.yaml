# Replace the image namespace and create Secret/pvuv-env before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvuv-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvuv
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  # SQLite WAL uses local filesystem locking. Never overlap old/new writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pvuv
  template:
    metadata:
      labels:
        app: pvuv
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: docker.io/YOUR_DOCKERHUB_USERNAME/pvuv.ai:devel
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: pvuv-env
          env:
            - name: SQLITE_PATH
              value: /data/pvuv.sqlite
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 3000 }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvuv-data
---
apiVersion: v1
kind: Service
metadata:
  name: pvuv
spec:
  type: ClusterIP
  selector:
    app: pvuv
  ports:
    - name: http
      port: 3000
      targetPort: http
