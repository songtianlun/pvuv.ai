name: Checks

on:
  pull_request:
    branches: [my, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type checks and all regression tests
        run: make check
      - uses: docker/setup-buildx-action@v3
      - name: Verify private scoring configuration cache invalidation
        run: make check-image-config
      - name: Build and start the native Docker image
        run: make dev
      - name: Verify HTTP, auth, queue and SQLite
        run: make smoke
      - name: Collect container logs
        if: always()
        run: node scripts/local-dev.mjs compose logs --tail 100 app
      - name: Stop development containers
        if: always()
        run: make dev-down
